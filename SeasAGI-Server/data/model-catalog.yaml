# SeasAGI standard model catalog.
# Contains model metadata for routing, cost optimization, and Combo intelligence.
# Synced into the model_catalog table on platform-api startup.

version: 1
models:
  # ---- OpenAI ----
  - name: "gpt-4o"
    display_name: "GPT-4o"
    description: "High-intelligence multimodal model for complex tasks"
    category: "openai"
    family: "gpt-4o"
    provider: "openai"
    modality: "chat"
    context_window: 128000
    max_output_tokens: 16384
    input_price_usd_per_1m: 2.5
    output_price_usd_per_1m: 10
    input_modalities: ["text", "image", "audio"]
    output_modalities: ["text"]
    capabilities: ["chat", "vision", "tools", "structured_outputs", "reasoning"]
    supported_parameters: ["temperature", "tools", "response_format", "reasoning"]
    metadata:
      source: "seasagi-standard-catalog"
      endpoints: "chat/completions,responses"
