name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-platform-api:
    name: Server platform-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SeasAGI-Server/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: SeasAGI-Server/platform-api/go.mod
          cache-dependency-path: SeasAGI-Server/platform-api/go.sum
      - run: go build ./...
      - run: go test ./... -timeout 120s
      - run: go vet ./...

  server-relay-gateway:
    name: Server relay-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SeasAGI-Server/relay-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: SeasAGI-Server/relay-gateway/go.mod
          cache-dependency-path: SeasAGI-Server/relay-gateway/go.sum
      - run: go build ./...
      - run: go test ./... -timeout 120s
      - run: go vet ./...

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SeasAGI-Client/src-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: SeasAGI-Client/src-app/go.mod
          cache-dependency-path: SeasAGI-Client/src-app/go.sum
      # main.go embeds frontend/dist via //go:embed; dist is git-ignored, so build it first.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: SeasAGI-Client/src-app/frontend/package-lock.json
      - name: Build frontend (tsc + vite build -> frontend/dist)
        working-directory: SeasAGI-Client/src-app/frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - run: go build ./...
      - run: go test ./... -timeout 120s
      - run: go vet ./...

  client-frontend:
    name: Client frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SeasAGI-Client/src-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: SeasAGI-Client/src-app/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:i18n
